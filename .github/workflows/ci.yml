name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            configure: vs2022-x64
            build: release
            test: release
          - arch: x86
            configure: vs2022-x86
            build: release-x86
            test: release-x86
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        if: matrix.arch == 'x64'
        with:
          dotnet-version: '10.0.x'
      - run: cmake --preset ${{ matrix.configure }}
      - run: cmake --build --preset ${{ matrix.build }} --parallel
      - run: ctest --preset ${{ matrix.test }}
      - name: Build the GeForce NOW bridge (.NET)
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $libg25 = (Get-ChildItem -Recurse -Filter libg25.dll build/${{ matrix.configure }} | Select-Object -First 1).FullName
          dotnet build gfn-bridge/src/G25GfnWheelBridge/G25GfnWheelBridge.csproj -c Release "-p:Libg25Dll=$libg25"
          dotnet build gfn-bridge/src/G25GfnBridgeService/G25GfnBridgeService.csproj -c Release

  portable:
    name: Portable core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DG25_BUILD_TOOL=OFF -DG25_BUILD_DIRECTINPUT=OFF -DG25_BUILD_TRAY=OFF -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
