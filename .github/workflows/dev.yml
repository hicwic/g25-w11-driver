name: Dev Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  dev:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve version
        shell: pwsh
        run: |
          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          "G25_VERSION=dev-$shortSha" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build x64
        run: |
          cmake --preset vs2022-x64
          cmake --build --preset release --parallel
          ctest --preset release
          cmake --install build/vs2022-x64 --config Release --prefix dist/stage-x64
      - name: Build x86
        run: |
          cmake --preset vs2022-x86
          cmake --build --preset release-x86 --parallel
          ctest --preset release-x86
          cmake --install build/vs2022-x86 --config Release --prefix dist/stage-x86
      - name: Package
        shell: pwsh
        run: |
          .\scripts\Package-Release.ps1 -Version $env:G25_VERSION -Build64 dist\stage-x64\bin -Build32 dist\stage-x86\bin
          .\scripts\Generate-Changelog.ps1 -Version $env:G25_VERSION -OutputPath dist\CHANGELOG.md
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $env:G25_PACKAGE_DIR = (Resolve-Path "dist\g25-w11-driver-$env:G25_VERSION").Path
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\g25-w11-driver.iss
      - name: Upload dev artifacts
        uses: actions/upload-artifact@v4
        with:
          name: g25-w11-driver-${{ env.G25_VERSION }}
          path: |
            dist/g25-w11-driver-${{ env.G25_VERSION }}.zip
            dist/g25-w11-driver-${{ env.G25_VERSION }}-setup.exe
            dist/CHANGELOG.md
