name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example v0.1.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Resolve version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } else {
            $version = $env:GITHUB_REF_NAME
          }
          "G25_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build x64
        run: |
          cmake --preset vs2022-x64
          cmake --build --preset release --parallel
          ctest --preset release
          cmake --install build/vs2022-x64 --config Release --prefix dist/stage-x64
      - name: Build x86
        run: |
          cmake --preset vs2022-x86
          cmake --build --preset release-x86 --parallel
          ctest --preset release-x86
          cmake --install build/vs2022-x86 --config Release --prefix dist/stage-x86
      - name: Package
        shell: pwsh
        run: |
          .\scripts\Package-Release.ps1 -Version $env:G25_VERSION -Build64 dist\stage-x64\bin -Build32 dist\stage-x86\bin
          .\scripts\Generate-Changelog.ps1 -Version $env:G25_VERSION -OutputPath dist\CHANGELOG.md
      - name: Publish GeForce NOW bridge payload
        shell: pwsh
        run: |
          $libg25 = (Resolve-Path "dist\stage-x64\bin\libg25.dll").Path
          $payload = "dist\gfn-bridge"
          dotnet publish gfn-bridge\src\G25GfnWheelBridge\G25GfnWheelBridge.csproj -c Release -r win-x64 --self-contained -o $payload "-p:Libg25Dll=$libg25"
          dotnet publish gfn-bridge\src\G25GfnBridgeService\G25GfnBridgeService.csproj -c Release -r win-x64 --self-contained -o $payload
          if (-not (Test-Path "$payload\g25gfnbridge.exe")) { throw "service exe missing from payload" }
      - name: Build installers
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $env:G25_PACKAGE_DIR = (Resolve-Path "dist\g25-w11-driver-$env:G25_VERSION").Path
          & $iscc installer\g25-w11-driver.iss
          $env:G25_GFN_PAYLOAD_DIR = (Resolve-Path "dist\gfn-bridge").Path
          & $iscc installer\g25-gfn-bridge.iss
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            "dist/g25-w11-driver-$env:G25_VERSION.zip",
            "dist/g25-w11-driver-$env:G25_VERSION-setup.exe",
            "dist/g25-gfn-bridge-$env:G25_VERSION-setup.exe"
          )
          gh release create $env:G25_VERSION $assets --target $env:GITHUB_SHA --title $env:G25_VERSION --notes-file dist\CHANGELOG.md
