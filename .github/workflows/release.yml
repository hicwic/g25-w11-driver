name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example v0.1.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $version = "${{ inputs.version }}"
          } else {
            $version = $env:GITHUB_REF_NAME
          }
          "G25_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Build x64
        run: |
          cmake --preset vs2022-x64
          cmake --build --preset release --parallel
          ctest --preset release
      - name: Build x86
        run: |
          cmake --preset vs2022-x86
          cmake --build --preset release-x86 --parallel
          ctest --preset release-x86
      - name: Package
        shell: pwsh
        run: |
          .\scripts\Package-Release.ps1 -Version $env:G25_VERSION -Build64 build\vs2022-x64 -Build32 build\vs2022-x86
          .\scripts\Generate-Changelog.ps1 -Version $env:G25_VERSION -OutputPath dist\CHANGELOG.md
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $env:G25_PACKAGE_DIR = (Resolve-Path "dist\g25-w11-driver-$env:G25_VERSION").Path
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\g25-w11-driver.iss
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            "dist/g25-w11-driver-$env:G25_VERSION.zip",
            "dist/g25-w11-driver-$env:G25_VERSION-setup.exe"
          )
          gh release create $env:G25_VERSION $assets --target $env:GITHUB_SHA --title $env:G25_VERSION --notes-file dist\CHANGELOG.md
